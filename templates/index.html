<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTEL Logger App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        h1 span {
            color: #00d4ff;
        }

        .config-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .config-section h2 {
            margin-bottom: 20px;
            color: #00d4ff;
            font-size: 1.3rem;
        }

        .config-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .config-group {
            flex: 1;
            min-width: 200px;
        }

        .config-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #aaa;
        }

        .config-group input, .config-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .config-group input:focus, .config-group select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .config-group select option {
            background: #1a1a2e;
        }

        .btn-update {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.4);
        }

        .log-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .log-section h2 {
            margin-bottom: 20px;
            color: #00d4ff;
            font-size: 1.3rem;
        }

        .message-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .message-input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .log-btn {
            padding: 20px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .log-btn:hover {
            transform: translateY(-3px);
        }

        .log-btn:active {
            transform: translateY(0);
        }

        .btn-debug {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: #fff;
        }

        .btn-debug:hover {
            box-shadow: 0 5px 20px rgba(108,117,125,0.5);
        }

        .btn-info {
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: #fff;
        }

        .btn-info:hover {
            box-shadow: 0 5px 20px rgba(23,162,184,0.5);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: #000;
        }

        .btn-warning:hover {
            box-shadow: 0 5px 20px rgba(255,193,7,0.5);
        }

        .btn-error {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: #fff;
        }

        .btn-error:hover {
            box-shadow: 0 5px 20px rgba(220,53,69,0.5);
        }

        .btn-critical {
            background: linear-gradient(135deg, #721c24, #491217);
            color: #fff;
            border: 2px solid #dc3545;
        }

        .btn-critical:hover {
            box-shadow: 0 5px 20px rgba(114,28,36,0.7);
        }

        .trace-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .trace-section h2 {
            margin-bottom: 20px;
            color: #00d4ff;
            font-size: 1.3rem;
        }

        .trace-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-trace {
            padding: 15px 30px;
            background: linear-gradient(135deg, #6f42c1, #5a32a3);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-trace:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(111,66,193,0.5);
        }

        .btn-metric {
            padding: 15px 30px;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-metric:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40,167,69,0.5);
        }

        .output-section {
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .output-section h2 {
            margin-bottom: 15px;
            color: #00d4ff;
            font-size: 1.3rem;
        }

        #output {
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            padding: 15px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .output-entry {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .output-success {
            background: rgba(40,167,69,0.2);
            border-left: 4px solid #28a745;
        }

        .output-error {
            background: rgba(220,53,69,0.2);
            border-left: 4px solid #dc3545;
        }

        .output-info {
            background: rgba(23,162,184,0.2);
            border-left: 4px solid #17a2b8;
        }

        .clear-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .config-row { flex-direction: column; }
            .button-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔭 <span>OpenTelemetry</span> Logger App</h1>

        <!-- Configuration Section -->
        <div class="config-section">
            <h2>⚙️ OTEL Collector Configuration</h2>
            <div class="config-row">
                <div class="config-group">
                    <label for="endpoint">Collector Endpoint URL</label>
                    <input type="text" id="endpoint" value="{{ config.endpoint }}" placeholder="http://localhost:4317">
                </div>
                <div class="config-group">
                    <label for="protocol">Protocol</label>
                    <select id="protocol">
                        <option value="grpc" {% if config.protocol == 'grpc' %}selected{% endif %}>gRPC (port 4317)</option>
                        <option value="http" {% if config.protocol == 'http' %}selected{% endif %}>HTTP (port 4318)</option>
                    </select>
                </div>
                <button class="btn-update" onclick="updateConfig()">Update Config</button>
            </div>
        </div>

        <!-- Log Buttons Section -->
        <div class="log-section">
            <h2>📝 Generate Logs</h2>
            <input type="text" id="logMessage" class="message-input" placeholder="Enter custom log message (optional)">
            <div class="button-grid">
                <button class="log-btn btn-debug" onclick="sendLog('debug')">
                    🔍 Debug
                </button>
                <button class="log-btn btn-info" onclick="sendLog('info')">
                    ℹ️ Info
                </button>
                <button class="log-btn btn-warning" onclick="sendLog('warning')">
                    ⚠️ Warning
                </button>
                <button class="log-btn btn-error" onclick="sendLog('error')">
                    ❌ Error
                </button>
                <button class="log-btn btn-critical" onclick="sendLog('critical')">
                    🔥 Critical
                </button>
            </div>
        </div>

        <!-- Trace & Metrics Section -->
        <div class="trace-section">
            <h2>📊 Traces & Metrics</h2>
            <div class="trace-row">
                <button class="btn-trace" onclick="generateTrace()">
                    🔗 Generate Trace
                </button>
                <button class="btn-metric" onclick="generateMetric()">
                    📈 Generate Metric
                </button>
            </div>
        </div>

        <!-- Output Section -->
        <div class="output-section">
            <h2>📋 Output Log</h2>
            <div id="output"></div>
            <button class="clear-btn" onclick="clearOutput()">Clear Output</button>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>Service: otel-logger-app</span>
            </div>
            <div>
                <span id="currentConfig">Endpoint: {{ config.endpoint }} | Protocol: {{ config.protocol }}</span>
            </div>
        </div>
    </div>

    <script>
        function addOutput(message, type = 'info') {
            const output = document.getElementById('output');
            const entry = document.createElement('div');
            entry.className = `output-entry output-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            output.insertBefore(entry, output.firstChild);
        }

        function updateConfig() {
            const endpoint = document.getElementById('endpoint').value;
            const protocol = document.getElementById('protocol').value;

            fetch('/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ endpoint, protocol })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    addOutput(`Configuration updated: ${endpoint} (${protocol})`, 'success');
                    document.getElementById('currentConfig').textContent = 
                        `Endpoint: ${endpoint} | Protocol: ${protocol}`;
                } else {
                    addOutput(`Config update failed: ${data.message}`, 'error');
                }
            })
            .catch(error => {
                addOutput(`Error: ${error.message}`, 'error');
            });
        }

        function sendLog(level) {
            const message = document.getElementById('logMessage').value || null;
            const body = message ? { message } : {};

            fetch(`/log/${level}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    addOutput(`📤 Sent ${level.toUpperCase()} log: "${data.message}"`, 'success');
                } else {
                    addOutput(`Failed to send log: ${data.error}`, 'error');
                }
            })
            .catch(error => {
                addOutput(`Error: ${error.message}`, 'error');
            });
        }

        function generateTrace() {
            fetch('/trace', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ operation: 'user-triggered-trace' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    addOutput(`🔗 Trace generated: ${data.operation}`, 'success');
                } else {
                    addOutput(`Failed to generate trace`, 'error');
                }
            })
            .catch(error => {
                addOutput(`Error: ${error.message}`, 'error');
            });
        }

        function generateMetric() {
            fetch('/metrics', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: 'user_action', value: 1 })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    addOutput(`📈 Metric recorded: ${data.metric} = ${data.value}`, 'success');
                } else {
                    addOutput(`Failed to record metric`, 'error');
                }
            })
            .catch(error => {
                addOutput(`Error: ${error.message}`, 'error');
            });
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }

        // Initial message
        addOutput('OTEL Logger App initialized. Ready to send telemetry!', 'info');
    </script>
</body>
</html>
